<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KhataFlow — Invoice & Expense Tracker</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo-dot"></span>
      <h1>KhataFlow</h1>
    </div>
    <div class="header-actions">
      <button id="themeToggle" class="btn ghost" title="Toggle Theme">Theme</button>
      <button id="exportCSV" class="btn">Export CSV</button>
      <button id="backupJSON" class="btn">Backup JSON</button>
      <label class="file-btn">
        Import
        <input type="file" id="importFile" accept=".csv,.json"/>
      </label>
      <button id="resetApp" class="btn danger" title="Clear all data">Reset</button>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>New / Edit Invoice</h2>
      <form id="invoiceForm" autocomplete="off">
        <input type="hidden" id="invoiceId"/>
        <div class="grid">
          <div class="field">
            <label for="client">Client</label>
            <input id="client" required placeholder="e.g., Acme Pvt Ltd"/>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <input id="category" list="categoryList" placeholder="e.g., Web Design"/>
            <datalist id="categoryList">
              <option>Web Design</option>
              <option>Development</option>
              <option>Consulting</option>
              <option>Content</option>
              <option>Other</option>
            </datalist>
          </div>
          <div class="field">
            <label for="amount">Amount (₹)</label>
            <input id="amount" type="number" step="0.01" min="0" required placeholder="e.g., 15000"/>
          </div>
          <div class="field">
            <label for="issueDate">Issue Date</label>
            <input id="issueDate" type="date" required/>
          </div>
          <div class="field">
            <label for="dueDate">Due Date</label>
            <input id="dueDate" type="date" required/>
          </div>
          <div class="field">
            <label for="status">Status</label>
            <select id="status" required>
              <option value="Pending">Pending</option>
              <option value="Paid">Paid</option>
            </select>
          </div>
          <div class="field span-2">
            <label for="notes">Notes</label>
            <input id="notes" placeholder="Optional notes"/>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" type="submit" id="saveBtn">Save</button>
          <button class="btn ghost" type="button" id="clearBtn">Clear</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Overview</h2>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Paid</div>
          <div class="stat-value" id="statPaid">₹0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pending</div>
          <div class="stat-value" id="statPending">₹0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Overdue</div>
          <div class="stat-value" id="statOverdue">₹0</div>
        </div>
      </div>
      <canvas id="revenueChart" height="120"></canvas>
    </section>

    <section class="panel">
      <h2>Filters & Search</h2>
      <div class="filters">
        <input id="search" placeholder="Search client, notes"/>
        <select id="filterStatus">
          <option value="">All Status</option>
          <option value="Paid">Paid</option>
          <option value="Pending">Pending</option>
          <option value="Overdue">Overdue</option>
        </select>
        <input id="filterCategory" placeholder="Category"/>
        <div class="date-range">
          <label>From</label><input id="fromDate" type="date"/>
          <label>To</label><input id="toDate" type="date"/>
        </div>
        <button id="clearFilters" class="btn ghost">Clear Filters</button>
      </div>
    </section>

    <section class="panel">
      <div class="table-head">
        <h2>Invoices</h2>
        <div class="table-actions">
          <span class="hint">Tip: Click headers to sort</span>
        </div>
      </div>
      <div class="table-wrap">
        <table id="invoiceTable">
          <thead>
            <tr>
              <th data-sort="client">Client</th>
              <th data-sort="category">Category</th>
              <th data-sort="amount" class="right">Amount (₹)</th>
              <th data-sort="issueDate">Issue</th>
              <th data-sort="dueDate">Due</th>
              <th data-sort="status">Status</th>
              <th class="right">Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div id="emptyState" class="empty hidden">No invoices yet.</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <template id="printTemplate">
    <html>
      <head>
        <meta charset="UTF-8"/>
        <title>Invoice — KhataFlow</title>
        <style>
          body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;padding:32px;color:#111;}
          .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
          .brand{font-size:24px;font-weight:700}
          .badge{padding:2px 8px;border-radius:999px;border:1px solid #ccc;font-size:12px}
          table{width:100%;border-collapse:collapse;margin-top:24px}
          th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
          .right{text-align:right}
          .muted{color:#666}
          .total{font-size:18px;font-weight:700}
        </style>
      </head>
      <body></body>
    </html>
  </template>

  <script src="script.js"></script>
</body>
</html>
